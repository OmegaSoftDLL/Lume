[plugin]
id = "dev.lume-lang.openidea"
name = "Lume Sovereign Language & Dracula Theme"
version = "1.0.0"
license = "Apache-2.0"
wit = "openidea:plugin@1.2.0"
vendor = "Omega DeepTech Systems Inc. (ODSI)"
repository = "https://github.com/OmegaSoftDLL/lume"
description = "Official Lume (.src, .lume, .intent, .mesh) language support, QF_LIA formal verification integration, LSP/DAP client, and Dracula Lume Sovereign color theme for OpenIDEA."

[capabilities]
filesystem = ["workspace:read", "workspace:write"]
process = ["lume"]

[[languages]]
id = "lume"
name = "Lume"
extensions = [".src", ".lume", ".intent", ".mesh"]
grammar = "syntaxes/lume.tmLanguage.json"
configuration = "language-configuration.json"
line_comment = "#"

[lsp]
language = "lume"
command = "lume"
args = ["lsp", "--stdio"]

[dap]
language = "lume"
adapter = "lume-dap"
command = "lume"
args = ["dap", "--stdio"]

[[themes]]
id = "dracula-lume-sovereign"
label = "Dracula Lume Sovereign"
ui_theme = "dark"
path = "themes/dracula-lume-color-theme.json"

[[run_configurations]]
id = "lume-run"
name = "Lume: Run File"
command = "lume"
args = ["run", "${file}"]

[[run_configurations]]
id = "lume-test"
name = "Lume: Run Tests"
command = "lume"
args = ["test", "${file}"]

[[run_configurations]]
id = "lume-prove"
name = "Lume: Prove QF_LIA Obligations"
command = "lume"
args = ["prove", "${file}"]

[[run_configurations]]
id = "lume-certify"
name = "Lume: Emit Proof Certificate (lcert)"
command = "lume"
args = ["certify", "${file}"]
