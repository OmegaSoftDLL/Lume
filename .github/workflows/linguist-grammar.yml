name: Linguist grammar integration

on:
  pull_request:
    paths:
      - ".github/workflows/linguist-grammar.yml"
      - "scripts/linguist_grammar.src"
      - "contrib/linguist/**"
      - "contrib/textmate/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/linguist-grammar.yml"
      - "scripts/linguist_grammar.src"
      - "contrib/linguist/**"
      - "contrib/textmate/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-grammar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this Lume revision
        uses: actions/checkout@v7
        with:
          path: lume

      - name: Test native Linguist orchestration
        working-directory: lume
        run: ./lume test scripts/linguist_grammar.src

      - name: Check out Linguist
        uses: actions/checkout@v7
        with:
          repository: github-linguist/linguist
          path: linguist

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: linguist
          bundler-cache: true

      - name: Validate with Linguist
        working-directory: lume
        run: ./lume run scripts/linguist_grammar.src "$GITHUB_WORKSPACE/lume" "$RUNNER_TEMP/lume-grammar.git" "$GITHUB_SHA" "$GITHUB_WORKSPACE/linguist" "$PATH" "$HOME" "$USER" "C.UTF-8"
