<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%" role="img" aria-labelledby="labsTitle labsDesc">
  <title id="labsTitle">LumeLabs — Official R&amp;D Incubator &amp; Experimental Innovation Hub (7 Research Divisions)</title>
  <desc id="labsDesc">Animated architectural showcase of LumeLabs' 7 Research Divisions: Chameleon Polyglot FFI, 1-Bit/Ternary Edge AI &amp; Liquid Audio, Quantum Nexus QEC, KerneLume Ring-0 OS &amp; Hardware Synthesis, Mechanized Soundness &amp; Proof Certificates, Native Desktop GUI/WASM/3D Graphics, and Applied Sovereign FinTech &amp; Cyber Forensics.</desc>

  <defs>
    <linearGradient id="bgLabs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0A1226"/>
      <stop offset="100%" stop-color="#070B16"/>
    </linearGradient>
    <linearGradient id="labCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F182D"/>
      <stop offset="100%" stop-color="#080E1C"/>
    </linearGradient>
    <linearGradient id="lumiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FFAA4D"/>
    </linearGradient>
    <filter id="labGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }

      @keyframes flowPipe {
        to { stroke-dashoffset: -44; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.93; }
        50% { transform: scale(1.015); opacity: 1; }
      }
      @keyframes sweepGlow {
        0% { transform: translateX(0px); opacity: 0.0; }
        20% { opacity: 0.7; }
        80% { opacity: 0.7; }
        100% { transform: translateX(1180px); opacity: 0.0; }
      }

      .lab-pipe { stroke-dasharray: 7 5; animation: flowPipe 1.8s linear infinite; }
      .lab-pulse { transform-box: fill-box; transform-origin: center; animation: pulseNode 3.8s ease-in-out infinite; }
      .lab-sweep { animation: sweepGlow 6.5s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .lab-pipe, .lab-pulse, .lab-sweep {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1280" height="420" rx="18" fill="url(#bgLabs)" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1E293B" stroke-width="0.6" opacity="0.4">
    <line x1="0" y1="78" x2="1280" y2="78"/>
    <line x1="0" y1="378" x2="1280" y2="378"/>
  </g>

  <!-- Animated Top Laser Bar -->
  <rect x="24" y="77" width="80" height="2.5" rx="1.2" fill="url(#lumiGrad)" class="lab-sweep"/>

  <!-- TOP HEADER -->
  <g class="sans">
    <rect x="24" y="16" width="194" height="24" rx="12" fill="#0E2538" stroke="#00D2FF" stroke-width="1.2"/>
    <circle cx="39" cy="28" r="4.5" fill="#00F5D4"/>
    <text x="51" y="32" fill="#E0F2FE" font-size="10.5" font-weight="800" letter-spacing="0.6">LUMELABS R&amp;D INCUBATOR</text>

    <text x="232" y="34" fill="#F8FAFC" font-size="20" font-weight="900" letter-spacing="-0.2">
      LumeLabs — 7 Sovereign Research Divisions &amp; Experimental Innovation Pipeline
    </text>
    <text x="24" y="61" fill="#94A3B8" font-size="12" font-weight="500">
      Every LumeLabs incubation must prove its core theorems in QF_LIA / QF_NIA (lcaas + lcert) before graduating to Stage-1 Production
    </text>

    <g class="lab-pulse">
      <rect x="1006" y="14" width="250" height="50" rx="10" fill="#0B192C" stroke="#34D399" stroke-width="1.5"/>
      <text x="1131" y="34" text-anchor="middle" fill="#34D399" class="mono" font-size="11.5" font-weight="800">7/7 Divisions Active &#10003;</text>
      <text x="1131" y="52" text-anchor="middle" fill="#38BDF8" class="mono" font-size="10.5" font-weight="700">RFC -&gt; Proof -&gt; Stage-1 Gate</text>
    </g>
  </g>

  <!-- ROW 1: LABS 01, 02, 03, 04 -->
  <g class="sans">
    <!-- Lab 01 -->
    <rect x="24" y="94" width="296" height="126" rx="11" fill="url(#labCard)" stroke="#00D2FF" stroke-width="1.4"/>
    <rect x="38" y="106" width="68" height="20" rx="5" fill="#082F49"/>
    <text x="72" y="120" text-anchor="middle" fill="#38BDF8" class="mono" font-size="10" font-weight="800">LAB 01</text>
    <text x="114" y="120" fill="#F8FAFC" font-size="12" font-weight="800">Chameleon Polyglot FFI</text>
    <text x="38" y="143" fill="#7DD3FC" class="mono" font-size="10.5">compiler/stage1/lchameleon.src</text>
    <text x="38" y="162" fill="#CBD5E1" font-size="11">• 9 ecosystems (C, Rust, Python, JS,</text>
    <text x="38" y="178" fill="#CBD5E1" font-size="11">  Go, Java, .NET, SQL, OpenAPI 3.1)</text>
    <text x="38" y="196" fill="#34D399" class="mono" font-size="10">[I0003] Fail-Closed · DLPack · 28/28 Proofs</text>

    <!-- Lab 02 -->
    <rect x="336" y="94" width="296" height="126" rx="11" fill="url(#labCard)" stroke="#10B981" stroke-width="1.4"/>
    <rect x="350" y="106" width="68" height="20" rx="5" fill="#064E3B"/>
    <text x="384" y="120" text-anchor="middle" fill="#34D399" class="mono" font-size="10" font-weight="800">LAB 02</text>
    <text x="426" y="120" fill="#F8FAFC" font-size="12" font-weight="800">1-Bit Edge AI &amp; Liquid Audio</text>
    <text x="350" y="143" fill="#6EE7B7" class="mono" font-size="10.5">compiler/stage1/lume_llm_core.src</text>
    <text x="350" y="162" fill="#CBD5E1" font-size="11">• Bonsai 1-bit &amp; BitNet 1.58-bit MAC</text>
    <text x="350" y="178" fill="#CBD5E1" font-size="11">• Liquid LFM3 24kHz · Colibri MoE SSD</text>
    <text x="350" y="196" fill="#34D399" class="mono" font-size="10">21/21 QF_LIA Proofs · 3-Tier Router</text>

    <!-- Lab 03 -->
    <rect x="648" y="94" width="296" height="126" rx="11" fill="url(#labCard)" stroke="#A855F7" stroke-width="1.4"/>
    <rect x="662" y="106" width="68" height="20" rx="5" fill="#3B0764"/>
    <text x="696" y="120" text-anchor="middle" fill="#C084FC" class="mono" font-size="10" font-weight="800">LAB 03</text>
    <text x="738" y="120" fill="#F8FAFC" font-size="12" font-weight="800">Quantum Nexus &amp; QEC</text>
    <text x="662" y="143" fill="#D8B4FE" class="mono" font-size="10.5">lume_quantum_nexus_engine.src</text>
    <text x="662" y="162" fill="#CBD5E1" font-size="11">• Linear Qubits [Q0001] No-Cloning</text>
    <text x="662" y="178" fill="#CBD5E1" font-size="11">• ZX-Calculus · Surface Code [[9,1,3]]</text>
    <text x="662" y="196" fill="#34D399" class="mono" font-size="10">OpenQASM 3.0 · QIR · Quil · IQM · Stim</text>

    <!-- Lab 04 -->
    <rect x="960" y="94" width="296" height="126" rx="11" fill="url(#labCard)" stroke="#FFAA4D" stroke-width="1.4"/>
    <rect x="974" y="106" width="68" height="20" rx="5" fill="#451A03"/>
    <text x="1008" y="120" text-anchor="middle" fill="#FBBF24" class="mono" font-size="10" font-weight="800">LAB 04</text>
    <text x="1050" y="120" fill="#F8FAFC" font-size="12" font-weight="800">KerneLume Ring-0 &amp; RTL</text>
    <text x="974" y="143" fill="#FDE68A" class="mono" font-size="10.5">apps/lume_os · ltarget.src</text>
    <text x="974" y="162" fill="#CBD5E1" font-size="11">• @freestanding Zero-GC Ring-0 OS</text>
    <text x="974" y="178" fill="#CBD5E1" font-size="11">• WCET [V0002] · Verilog/VHDL · openTPU</text>
    <text x="974" y="196" fill="#34D399" class="mono" font-size="10">[K0005] W^X DMA · [K0006] Stack Guard</text>
  </g>

  <!-- ANIMATED INTERCONNECT PIPES BETWEEN ROWS -->
  <g fill="none" stroke-width="1.6" class="lab-pipe">
    <path d="M 172 220 L 172 238" stroke="#00D2FF"/>
    <path d="M 484 220 L 484 238" stroke="#10B981"/>
    <path d="M 796 220 L 796 238" stroke="#A855F7"/>
    <path d="M 1108 220 L 1108 238" stroke="#FFAA4D"/>
  </g>

  <!-- ROW 2: LABS 05, 06, 07 + GRADUATION PIPELINE -->
  <g class="sans">
    <!-- Lab 05 -->
    <rect x="24" y="238" width="296" height="126" rx="11" fill="url(#labCard)" stroke="#38BDF8" stroke-width="1.4"/>
    <rect x="38" y="250" width="68" height="20" rx="5" fill="#0C4A6E"/>
    <text x="72" y="264" text-anchor="middle" fill="#7DD3FC" class="mono" font-size="10" font-weight="800">LAB 05</text>
    <text x="114" y="264" fill="#F8FAFC" font-size="12" font-weight="800">Mechanized Soundness</text>
    <text x="38" y="287" fill="#7DD3FC" class="mono" font-size="10.5">lcaas.src · lcert.src · LumeCore.lean</text>
    <text x="38" y="306" fill="#CBD5E1" font-size="11">• QF_LIA, QF_NIA, QF_BV &amp; Sep Logic</text>
    <text x="38" y="322" fill="#CBD5E1" font-size="11">• Standalone SHA-256 Proof Certificates</text>
    <text x="38" y="340" fill="#34D399" class="mono" font-size="10">413 Embedded Compiler Obligations</text>

    <!-- Lab 06 -->
    <rect x="336" y="238" width="296" height="126" rx="11" fill="url(#labCard)" stroke="#F472B6" stroke-width="1.4"/>
    <rect x="350" y="250" width="68" height="20" rx="5" fill="#500724"/>
    <text x="384" y="264" text-anchor="middle" fill="#F9A8D4" class="mono" font-size="10" font-weight="800">LAB 06</text>
    <text x="426" y="264" fill="#F8FAFC" font-size="12" font-weight="800">Native GUI, WASM &amp; 3D</text>
    <text x="350" y="287" fill="#FBCFE8" class="mono" font-size="10.5">x86_64-windows-gui · gui.src · gfx.src</text>
    <text x="350" y="306" fill="#CBD5E1" font-size="11">• 33.7 KB PE32+ Win64 Native Cockpit</text>
    <text x="350" y="322" fill="#CBD5E1" font-size="11">• Wayland xdg-dialog-v1 · Perceus VDOM</text>
    <text x="350" y="340" fill="#34D399" class="mono" font-size="10">Zero Runtime Bloat · 60 FPS Mesh</text>

    <!-- Lab 07 -->
    <rect x="648" y="238" width="296" height="126" rx="11" fill="url(#labCard)" stroke="#34D399" stroke-width="1.4"/>
    <rect x="662" y="250" width="68" height="20" rx="5" fill="#064E3B"/>
    <text x="696" y="264" text-anchor="middle" fill="#6EE7B7" class="mono" font-size="10" font-weight="800">LAB 07</text>
    <text x="738" y="264" fill="#F8FAFC" font-size="12" font-weight="800">FinTech, Pix &amp; Cyber Defense</text>
    <text x="662" y="287" fill="#A7F3D0" class="mono" font-size="10.5">examples/apps/* (8 Capstones)</text>
    <text x="662" y="306" fill="#CBD5E1" font-size="11">• SEFAZ NF-e, BACEN Pix &amp; CNPJ 2026</text>
    <text x="662" y="322" fill="#CBD5E1" font-size="11">• Zero-Breach STIX 2.1 &amp; UAV Guard</text>
    <text x="662" y="340" fill="#34D399" class="mono" font-size="10">81/81 Capstone Obligations Proven</text>

    <!-- Graduation Gate Card -->
    <rect x="960" y="238" width="296" height="126" rx="11" fill="#091D26" stroke="#00F5D4" stroke-width="1.6"/>
    <text x="1108" y="262" text-anchor="middle" fill="#00F5D4" class="mono" font-size="11.5" font-weight="800">
      LUMELABS CLI &amp; GRADUATION GATE
    </text>
    <text x="976" y="285" fill="#F8FAFC" class="mono" font-size="10.5">$ lume consult "&lt;research_goal&gt;"</text>
    <text x="976" y="303" fill="#F8FAFC" class="mono" font-size="10.5">$ lume evolve &lt;module.src&gt;</text>
    <text x="976" y="321" fill="#7DD3FC" class="mono" font-size="10.5">$ lume chameleon  |  lume genesis</text>
    <text x="976" y="339" fill="#34D399" class="mono" font-size="10.5">$ lume prove &amp;&amp; lume certify</text>
    <text x="976" y="355" fill="#FDE047" class="mono" font-size="10">Status: 100% Pure-Lume (.src) Required</text>
  </g>

  <!-- FOOTER -->
  <g class="mono" font-size="10.5" fill="#94A3B8">
    <text x="24" y="403">LumeLabs Sovereign Innovation Hub · Open RFCs via GitHub Discussions &amp; Issues · Bilingual EN / PT-BR Community</text>
    <text x="1256" y="403" text-anchor="end" fill="#00F5D4">Lume v1.1.0 · Zero-C Steady State</text>
  </g>
</svg>
