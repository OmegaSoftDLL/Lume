  <!-- FOOTER BAR -->
  <g class="mono" font-size="10.5" fill="#94A3B8">
    <text x="24" y="542">Lume v1.1.0 Sovereign Polyglot Architecture · Lumi Crystal Chameleon Mascot · Pure-Lume Stage-1 Engine</text>
    <text x="1256" y="542" text-anchor="end" fill="#34D399">stage2 == stage3 · 99/99 Manifest Verified</text>
