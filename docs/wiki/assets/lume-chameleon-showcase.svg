      SOVEREIGN LUME-CORE OUTPUT &amp; CLI
    </text>

    <!-- Card 1: Verified Type Promotion -->
    <rect x="900" y="114" width="356" height="92" rx="10" fill="url(#cardDark)" stroke="#10B981" stroke-width="1.4"/>
    <text x="918" y="136" fill="#34D399" font-size="12.5" font-weight="800">Mathematically Proven verified[T]</text>
    <text x="918" y="156" fill="#E2E8F0" class="mono" font-size="10.5">• Zero-copy DLPack tensor[DType, Shape, Dev]</text>
    <text x="918" y="174" fill="#E2E8F0" class="mono" font-size="10.5">• Perceus borrow &amp;T without GC pause</text>
    <text x="918" y="192" fill="#E2E8F0" class="mono" font-size="10.5">• ACID table[T] &amp; decimal(p,s) SQL rows</text>

    <!-- Card 2: Polyglot CLI Commands -->
    <rect x="900" y="218" width="356" height="172" rx="10" fill="url(#cardDark)" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="918" y="240" fill="#38BDF8" font-size="12.5" font-weight="800">Chameleon CLI &amp; Interactive REPL / LSP</text>
    <text x="918" y="262" fill="#F8FAFC" class="mono" font-size="10.5">$ lume chameleon [eco]</text>
    <text x="918" y="281" fill="#F8FAFC" class="mono" font-size="10.5">$ lume camaleao [eco]</text>
    <text x="918" y="300" fill="#7DD3FC" class="mono" font-size="10.5">$ lume polyglot   |   $ lume ffi-bridge</text>
    <text x="918" y="319" fill="#34D399" class="mono" font-size="10">$ lume adapt &lt;c|rust|python|js|go|</text>
    <text x="934" y="335" fill="#34D399" class="mono" font-size="10">java|dotnet|sql|openapi&gt; [file]</text>
    <text x="918" y="355" fill="#FDE047" class="mono" font-size="10.5">$ lume morph &lt;legacy_file&gt;</text>
    <text x="918" y="375" fill="#C4B5FD" class="mono" font-size="10.5">lume repl &gt; :chameleon  /  :camaleao</text>

    <!-- Card 3: Certificate Badge -->
    <rect x="900" y="402" width="356" height="92" rx="10" fill="#091D26" stroke="#00F5D4" stroke-width="1.6"/>
    <text x="1078" y="427" text-anchor="middle" fill="#00F5D4" class="mono" font-size="12" font-weight="800">
