<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="100%" height="100%" role="img" aria-labelledby="chamTitle chamDesc">
  <title id="chamTitle">Lume Universal Chameleon Polyglot Interop Engine (lchameleon.src) — 9 Verified Ecosystems</title>
  <desc id="chamDesc">Animated architecture diagram of Lume's Universal Chameleon Polyglot Interop Engine (lchameleon.src), showing 9 foreign ecosystems adapted through Lumi's [I0003] Fail-Closed QF_LIA Proof Gate from unverified[T] to verified[T].</desc>

  <defs>
    <linearGradient id="bgCham" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0A1224"/>
      <stop offset="100%" stop-color="#060A15"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F182C"/>
      <stop offset="100%" stop-color="#090F1D"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="lumiCrest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }

      @keyframes flowDash {
        to { stroke-dashoffset: -48; }
      }
      @keyframes prismPulse {
        0%, 100% { transform: scale(1); opacity: 0.94; }
        50% { transform: scale(1.018); opacity: 1; }
      }
      @keyframes scanGate {
        0% { transform: translateY(0px); opacity: 0.0; }
        20% { opacity: 0.75; }
        80% { opacity: 0.75; }
        100% { transform: translateY(250px); opacity: 0.0; }
      }
      @keyframes badgePulse {
        0%, 100% { stroke-opacity: 0.75; }
        50% { stroke-opacity: 1; }
      }

      .pipe-in { stroke-dasharray: 7 5; animation: flowDash 1.9s linear infinite; }
      .pipe-out { stroke-dasharray: 8 5; animation: flowDash 1.5s linear infinite; }
      .prism-hub { transform-box: fill-box; transform-origin: center; animation: prismPulse 3.6s ease-in-out infinite; }
      .gate-scan { animation: scanGate 4.8s ease-in-out infinite; }
      .v-badge { animation: badgePulse 2.8s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .pipe-in, .pipe-out, .prism-hub, .gate-scan, .v-badge {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1280" height="560" rx="18" fill="url(#bgCham)" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Structural Grid -->
  <g stroke="#1E293B" stroke-width="0.6" opacity="0.42">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="516" x2="1280" y2="516"/>
    <line x1="392" y1="80" x2="392" y2="516"/>
    <line x1="868" y1="80" x2="868" y2="516"/>
  </g>

  <!-- TOP HEADER BANNER -->
  <g class="sans">
    <rect x="24" y="16" width="212" height="24" rx="12" fill="#0D2824" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="39" cy="28" r="4.5" fill="#00F5D4"/>
    <text x="51" y="32" fill="#D1FAE5" font-size="10.5" font-weight="800" letter-spacing="0.6">LUMI POLYGLOT ENGINE · v1.1.0</text>

    <text x="248" y="34" fill="#F8FAFC" font-size="19.5" font-weight="900" letter-spacing="-0.2">
      Lume Universal Chameleon Polyglot Interop Engine (lchameleon.src) — 9 Verified Ecosystems
    </text>
    <text x="24" y="61" fill="#94A3B8" font-size="12" font-weight="500">
      Automatic FFI Bridge Synthesis · [I0003] Fail-Closed QF_LIA Boundary Contracts · Zero-Copy DLPack Tensors · 100% Native Lume
    </text>

    <g class="v-badge">
      <rect x="1008" y="14" width="248" height="50" rx="10" fill="#0B192C" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="1132" y="34" text-anchor="middle" fill="#38BDF8" class="mono" font-size="11.5" font-weight="800">Lume Verified &#10003; · [I0003]</text>
      <text x="1132" y="52" text-anchor="middle" fill="#34D399" class="mono" font-size="10.5" font-weight="700">28/28 QF_LIA · 8/8 Tests</text>
    </g>
  </g>

  <!-- LEFT COLUMN: 9 FOREIGN ECOSYSTEMS -->
  <g class="sans">
    <text x="26" y="102" fill="#38BDF8" font-size="11" font-weight="800" letter-spacing="0.9">9 FOREIGN ECOSYSTEMS (UNVERIFIED[T] INPUTS)</text>

    <!-- 1. C / C++ ABI -->
    <rect x="24" y="112" width="328" height="38" rx="7" fill="url(#cardDark)" stroke="#38BDF8" stroke-width="1.1"/>
    <circle cx="40" cy="131" r="4" fill="#38BDF8"/>
    <text x="52" y="128" fill="#F8FAFC" font-size="12" font-weight="800">1. C / C++ ABI</text>
    <text x="166" y="128" fill="#7DD3FC" class="mono" font-size="10.5">c_abi</text>
    <text x="52" y="143" fill="#94A3B8" class="mono" font-size="10">.h / .dll / .so · @repr(c) · Non-Null Guard</text>

    <!-- 2. Rust cdylib -->
    <rect x="24" y="155" width="328" height="38" rx="7" fill="url(#cardDark)" stroke="#F97316" stroke-width="1.1"/>
    <circle cx="40" cy="174" r="4" fill="#F97316"/>
    <text x="52" y="171" fill="#F8FAFC" font-size="12" font-weight="800">2. Rust cdylib</text>
    <text x="166" y="171" fill="#FDBA74" class="mono" font-size="10.5">rust_cdylib</text>
    <text x="52" y="186" fill="#94A3B8" class="mono" font-size="10">Cargo extern "C" · Perceus Borrow (&amp;T / own T)</text>

    <!-- 3. Python C-API -->
    <rect x="24" y="198" width="328" height="38" rx="7" fill="url(#cardDark)" stroke="#FACC15" stroke-width="1.1"/>
    <circle cx="40" cy="217" r="4" fill="#FACC15"/>
    <text x="52" y="214" fill="#F8FAFC" font-size="12" font-weight="800">3. Python C-API</text>
    <text x="166" y="214" fill="#FDE047" class="mono" font-size="10.5">python_capi</text>
    <text x="52" y="229" fill="#94A3B8" class="mono" font-size="10">PyObject* · DLPack Zero-Copy Tensor Bridge</text>

    <!-- 4. Node.js & WASM -->
    <rect x="24" y="241" width="328" height="38" rx="7" fill="url(#cardDark)" stroke="#34D399" stroke-width="1.1"/>
    <circle cx="40" cy="260" r="4" fill="#34D399"/>
    <text x="52" y="257" fill="#F8FAFC" font-size="12" font-weight="800">4. Node.js &amp; WASM</text>
    <text x="180" y="257" fill="#6EE7B7" class="mono" font-size="10.5">node_napi_wasm</text>
    <text x="52" y="272" fill="#94A3B8" class="mono" font-size="10">N-API · 64 KiB WASM Linear Memory Page Bounds</text>

    <!-- 5. Go c-shared -->
    <rect x="24" y="284" width="328" height="38" rx="7" fill="url(#cardDark)" stroke="#22D3EE" stroke-width="1.1"/>
    <circle cx="40" cy="303" r="4" fill="#22D3EE"/>
    <text x="52" y="300" fill="#F8FAFC" font-size="12" font-weight="800">5. Go c-shared</text>
    <text x="166" y="300" fill="#67E8F9" class="mono" font-size="10.5">go_cshared</text>
    <text x="52" y="315" fill="#94A3B8" class="mono" font-size="10">cgo · Pointer-Pinning &amp; Goroutine Stack Guard</text>

    <!-- 6. Java JNI & Panama -->
    <rect x="24" y="327" width="328" height="38" rx="7" fill="url(#cardDark)" stroke="#FB7185" stroke-width="1.1"/>
    <circle cx="40" cy="346" r="4" fill="#FB7185"/>
    <text x="52" y="343" fill="#F8FAFC" font-size="12" font-weight="800">6. Java JNI &amp; Panama</text>
    <text x="188" y="343" fill="#FDA4AF" class="mono" font-size="10.5">java_jni</text>
    <text x="52" y="358" fill="#94A3B8" class="mono" font-size="10">JNIEnv* · Local Ref Frame Capacity &lt;= 64</text>

    <!-- 7. C# / .NET P/Invoke -->
    <rect x="24" y="370" width="328" height="38" rx="7" fill="url(#cardDark)" stroke="#A78BFA" stroke-width="1.1"/>
    <circle cx="40" cy="389" r="4" fill="#A78BFA"/>
    <text x="52" y="386" fill="#F8FAFC" font-size="12" font-weight="800">7. C# / .NET P/Invoke</text>
    <text x="192" y="386" fill="#C4B5FD" class="mono" font-size="10.5">dotnet_pinvoke</text>
    <text x="52" y="401" fill="#94A3B8" class="mono" font-size="10">NativeAOT · Blittable Struct Size &amp; Align</text>

    <!-- 8. SQL Relational -->
    <rect x="24" y="413" width="328" height="38" rx="7" fill="url(#cardDark)" stroke="#60A5FA" stroke-width="1.1"/>
    <circle cx="40" cy="432" r="4" fill="#60A5FA"/>
    <text x="52" y="429" fill="#F8FAFC" font-size="12" font-weight="800">8. SQL Relational</text>
    <text x="172" y="429" fill="#93C5FD" class="mono" font-size="10.5">sql_relational</text>
    <text x="52" y="444" fill="#94A3B8" class="mono" font-size="10">DDL/DML -&gt; table[T] · ACID Decimal Precision</text>

    <!-- 9. OpenAPI 3.1 & gRPC -->
    <rect x="24" y="456" width="328" height="38" rx="7" fill="url(#cardDark)" stroke="#F472B6" stroke-width="1.1"/>
    <circle cx="40" cy="475" r="4" fill="#F472B6"/>
    <text x="52" y="472" fill="#F8FAFC" font-size="12" font-weight="800">9. OpenAPI 3.1 &amp; gRPC</text>
    <text x="194" y="472" fill="#F9A8D4" class="mono" font-size="10.5">openapi_rpc</text>
    <text x="52" y="487" fill="#94A3B8" class="mono" font-size="10">TLS 1.3 · Bounded Payload &amp; Schema Verification</text>
  </g>

  <!-- ANIMATED DATA PIPES: LEFT -> CENTER HUB -->
  <g fill="none" stroke-width="1.6" class="pipe-in">
    <path d="M 352 131 C 388 131, 396 220, 428 242" stroke="#38BDF8"/>
    <path d="M 352 174 C 386 174, 396 232, 428 254" stroke="#F97316"/>
    <path d="M 352 217 C 386 217, 396 248, 428 266" stroke="#FACC15"/>
    <path d="M 352 260 C 388 260, 398 274, 428 280" stroke="#34D399"/>
    <path d="M 352 303 C 390 303, 398 295, 428 295" stroke="#22D3EE"/>
    <path d="M 352 346 C 388 346, 398 312, 428 310" stroke="#FB7185"/>
    <path d="M 352 389 C 388 389, 396 326, 428 322" stroke="#A78BFA"/>
    <path d="M 352 432 C 388 432, 396 340, 428 334" stroke="#60A5FA"/>
    <path d="M 352 475 C 388 475, 396 352, 428 346" stroke="#F472B6"/>
  </g>

  <!-- CENTER HUB: LUMI — THE SOVEREIGN CHAMELEON BRIDGE & [I0003] PROOF GATE -->
  <g class="sans">
    <text x="630" y="102" text-anchor="middle" fill="#00F5D4" font-size="11" font-weight="800" letter-spacing="0.9">
      LUMI — THE SOVEREIGN CHAMELEON BRIDGE (lchameleon.src)
    </text>

    <g class="prism-hub">
      <!-- Outer Crystal Prism Box -->
      <rect x="428" y="114" width="404" height="380" rx="16" fill="url(#cardDark)" stroke="url(#lumiCrest)" stroke-width="2"/>
      <rect x="440" y="126" width="380" height="356" rx="12" fill="url(#prismGrad)" stroke="#1E293B" stroke-width="1"/>

      <!-- Scanning Proof Beam -->
      <rect x="444" y="150" width="372" height="22" rx="4" fill="#10B981" fill-opacity="0.16" class="gate-scan"/>

      <!-- Stylized Bioluminescent Crystal Chameleon Crest (Lumi) -->
      <polygon points="630,136 664,154 652,186 608,186 596,154" fill="#082F49" stroke="#00F5D4" stroke-width="1.8" filter="url(#softGlow)"/>
      <circle cx="620" cy="160" r="3.5" fill="#00F5D4"/>
      <circle cx="640" cy="160" r="3.5" fill="#38BDF8"/>
      <path d="M 612 174 Q 630 182 648 174" fill="none" stroke="#34D399" stroke-width="2"/>

      <text x="630" y="208" text-anchor="middle" fill="#F8FAFC" font-size="14.5" font-weight="900">
        [I0003] Fail-Closed QF_LIA Proof Gate
      </text>
      <text x="630" y="226" text-anchor="middle" fill="#7DD3FC" class="mono" font-size="11" font-weight="700">
        unverified[T]  ===&gt;  verified[T]
      </text>

      <!-- Boundary Contract Verification Box -->
      <rect x="454" y="238" width="352" height="170" rx="10" fill="#070C18" stroke="#10B981" stroke-width="1.3"/>
      <text x="470" y="259" fill="#34D399" class="mono" font-size="11" font-weight="800"># Compile-Time Boundary Obligations (lcaas + lcert)</text>
      <text x="470" y="280" fill="#E2E8F0" class="mono" font-size="11">requires null_checked == 1</text>
      <text x="470" y="299" fill="#E2E8F0" class="mono" font-size="11">requires align_ok == 1</text>
      <text x="470" y="318" fill="#E2E8F0" class="mono" font-size="11">requires len &gt;= 0 and len &lt;= cap</text>
      <text x="470" y="337" fill="#38BDF8" class="mono" font-size="11">effect   / {ffi} capability isolation</text>
      <text x="470" y="356" fill="#FDE047" class="mono" font-size="11">ensures  result &gt;= lo and result &lt;= hi</text>
      <text x="470" y="376" fill="#A78BFA" class="mono" font-size="10.5">law chameleon_all_ecosystems_verified == 1</text>
      <text x="470" y="395" fill="#6EE7B7" class="mono" font-size="10.5">status: 28/28 proven obligations · 8/8 unit tests</text>

      <!-- Bottom Status Pill inside Hub -->
      <rect x="454" y="420" width="352" height="50" rx="9" fill="#0B211D" stroke="#34D399" stroke-width="1.3"/>
      <text x="630" y="441" text-anchor="middle" fill="#D1FAE5" class="mono" font-size="11.5" font-weight="800">
        0 Unchecked Foreign Pointers · 0 Buffer Overflows
      </text>
      <text x="630" y="459" text-anchor="middle" fill="#34D399" class="mono" font-size="10.5" font-weight="700">
        Invalid Foreign Return -&gt; Rejected Fail-Closed [I0003]
      </text>
    </g>
  </g>

  <!-- ANIMATED DATA PIPES: CENTER HUB -> RIGHT COLUMN -->
  <g fill="none" stroke="url(#emeraldGlow)" stroke-width="2.2" class="pipe-out">
    <path d="M 832 215 C 862 215, 872 175, 900 175"/>
    <path d="M 832 265 C 864 265, 874 265, 900 265"/>
    <path d="M 832 315 C 864 315, 874 355, 900 355"/>
    <path d="M 832 365 C 862 365, 872 445, 900 445"/>
